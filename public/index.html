<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="/emoji-picker/index.js"></script>
</head>
<body>
  <div id="auth-screen">
    <h1>Pulse</h1>
    <form id="auth-form">
      <input id="username-input" placeholder="Username" maxlength="20" autocomplete="off" />
      <input id="password-input" type="password" placeholder="Password" autocomplete="off" />
      <button type="submit" id="auth-submit">Log in</button>
    </form>
    <p id="auth-error"></p>
    <button id="toggle-mode" type="button">Need an account? Register</button>
  </div>

  <div id="chat-screen" hidden>
    <div id="sidebar">
      <h2>Rooms</h2>
      <ul id="room-list"></ul>
      <h2>Online</h2>
      <ul id="user-list"></ul>
    </div>
    <div id="chat-main">
      <header>
        <span id="current-room">Pulse</span>
        <button id="logout-btn" type="button">Log out</button>
      </header>
      <ul id="messages"></ul>
      <p id="typing-indicator"></p>
      <div id="emoji-wrapper">
        <emoji-picker id="emoji-picker" hidden></emoji-picker>
      </div>
      <form id="chat-form">
        <button type="button" id="emoji-btn">😊</button>
        <input id="message-input" placeholder="Type a message..." maxlength="500" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
