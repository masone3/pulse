<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="join-screen">
    <h1>Pulse</h1>
    <form id="join-form">
      <input id="username-input" placeholder="Pick a username" maxlength="20" autocomplete="off" />
      <button type="submit">Join</button>
    </form>
  </div>

  <div id="chat-screen" hidden>
    <header>Pulse</header>
    <ul id="messages"></ul>
    <form id="chat-form">
      <input id="message-input" placeholder="Type a message..." maxlength="500" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
